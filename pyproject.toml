[project]
name = "sketch"
version = "0.1.0"
description = "Visual agent builder: sketch an agent graph, bind a model to every stage, generate pydantic-deep code, run it, and review optimization proposals."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "anthropic==1.0.0",
    "deepdiff==9.1.0",
    "fastapi>=0.115",
    "networkx==3.6.1",
    "pydantic==2.13.4",
    "pydantic-ai-slim[anthropic,duckduckgo]==2.33.0",
    "pydantic-deep==0.3.43",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "simpleeval==1.0.7",
    "sse-starlette==3.4.8",
    "tiktoken==0.14.0",
    "typer==0.24.1",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
sketch = "sketch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sketch"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.20",
    "ty==0.0.56",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# ruff format owns line length. E501 only ever fires on what the formatter
# cannot split, which is a long string literal, and a prompt is as long as
# the prompt needs to be.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
